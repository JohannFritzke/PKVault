#cloud-config
# First boot of the PokéHome VM: updates, swap (the micro VM has 1 GB RAM)
# and the host firewall. Oracle's Ubuntu images block 80/443 in iptables
# even when the security list allows them, so they are opened here.

timezone: America/Sao_Paulo

package_update: true
package_upgrade: true

packages:
  - unzip
  - curl

runcmd:
  # 2 GB swap
  - fallocate -l 2G /swapfile
  - chmod 600 /swapfile
  - mkswap /swapfile
  - swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab
  # open HTTP/HTTPS right above Oracle's default REJECT rule (its position varies
  # between image versions), and keep it after reboot
  - |
    pos=$(iptables -L INPUT --line-numbers -n | awk '/REJECT/ {print $1; exit}')
    iptables -I INPUT "${pos:-1}" -m state --state NEW -p tcp --dport 443 -j ACCEPT
    iptables -I INPUT "${pos:-1}" -m state --state NEW -p tcp --dport 80 -j ACCEPT
    netfilter-persistent save
